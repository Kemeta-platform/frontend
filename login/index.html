<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kemeta - Discover Egypt</title>
  
    <script>
    (function() {
      const savedTheme = localStorage.getItem("kemeta_theme");
      if (savedTheme === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>

  <link rel="stylesheet" href="../vendors/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="../vendors/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components/auth.css">
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <div class="auth-container">
    <div class="auth-wrapper">
      
      <!-- Left Teal Card (الأكبر حجماً) -->
      <div class="left-card">
        <div class="teal-panel">
          <a href="../index.html" class="btn-back">
            <i class="fa-solid fa-angle-left"></i> Back
          </a>

          <section class="card-container">
            <!-- Brand Content -->
            <div class="brand-section">
              <div class="logo-container">
                <img src="../assets/images/logos/SVG/Logo (3).svg" alt="Kemeta Logo">
              </div>
              <h1>Welcome Back</h1>
              <p>Log in to pick up your trip planning right where you left off.</p>
            </div>

            <!-- Stats Box -->
            <div class="stats-card">
              <h2>500<span class="plus">+</span></h2>
              <div class="stats-title">Places mapped across Egypt</div>
              <div class="stats-grid">
                <div class="stats-item">
                  <h4>4</h4>
                  <span>Cities</span>
                </div>
                <div class="stats-item">
                  <h4>24/7</h4>
                  <span>AI support</span>
                </div>
              </div>
            </div>
          </section>
        </div>
      </div>

      <!-- Right Login Form -->
      <div class="right-card">
        <div class="form-panel">

           <a href="../index.html" class="btn-back-mobile">
      <i class="fa-solid fa-angle-left"></i> Back
    </a>

    <div class="step-content">
          <div class="form-header">
            <h2>Log In</h2>
            <p>Good to see you again. Let's get you back in.</p>
          </div>

          <!-- Google Login -->
          <button type="button" class="btn-google">
            <svg width="20" height="20" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            Google
          </button>

          <!-- Divider -->
          <div class="divider">
            <span>or</span>
          </div>

          <!-- Form Fields -->
          <form id="loginForm">
    <div class="mb-3">
  <label class="form-label" for="emailInput">Email</label>
  <input 
    type="email" 
    id="emailInput"
    class="form-control-custom" 
    placeholder="e.g. AhmedMohamed@gmail.com" 
    required
  >
</div>

<div class="mb-2 w-auto">
  <label class="form-label" for="passwordInput">Password</label>
  <div class="custom-input-group">
    <input 
      type="password" 
      id="passwordInput" 
      class="form-control-custom" 
      placeholder="Enter your password" 
      required
    >
    <button type="button" class="btn-toggle-password" id="togglePasswordBtn" title="Toggle password visibility">
      <i class="fa-regular fa-eye-slash"></i>
    </button>
  </div>
              <a href="../reset-password/index.html" class="forgot-link">Forgot password?</a>
            </div>

            <button type="submit" class="btn-submit">Log In</button>
          </form>

          <div class="signup-text">
            Don't have an account? <a href="../register/index.html">Sign up</a>
          </div>
      </div>
    </div>
    </div>
  </div>
   </div>


  <script src="../vendors/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="login.js"></script>
<script src="../js/theme.js"></script>
</body>
</html>
